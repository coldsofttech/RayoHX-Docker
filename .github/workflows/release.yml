name: Release

# Publishes the image (linux/amd64 and linux/arm64) when a GitHub release is published, with the tag
# vX.Y.Z (which must be "v" plus the contents of the VERSION file) (X.Y.Z, X.Y and, for a full release, latest). Each registry is off until you enable it
# with a repository variable (Settings > Secrets and variables > Actions > Variables):
#   PUBLISH_GHCR=true         -> ghcr.io/<owner>/<image name>
#   DOCKERHUB_USERNAME=<name> -> docker.io/<namespace>/<image name> (also needs the
#   DOCKERHUB_TOKEN secret); the namespace is DOCKERHUB_NAMESPACE below, else the username
on:
  release:
    types: [published]

permissions:
  contents: read

# One publish per release tag at a time; a second run waits instead of racing the first.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  # The image name, and the Docker Hub namespace when it differs from the username.
  IMAGE_NAME: rayohx
  DOCKERHUB_NAMESPACE: ""

jobs:
  check:
    name: Check the tag
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check the tag matches the VERSION file
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ -n "$version" ] && [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-ghcr:
    name: Publish to GitHub Container Registry
    needs: check
    if: vars.PUBLISH_GHCR == 'true' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          flavor: latest=false
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          build-args: VERSION=${{ needs.check.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-dockerhub:
    name: Publish to Docker Hub
    needs: check
    if: vars.DOCKERHUB_USERNAME != '' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: docker
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Work out image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          flavor: latest=false
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          build-args: VERSION=${{ needs.check.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
